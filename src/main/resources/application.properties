# The hosting service tells the app which port to use (PORT); on your own computer it is 8081.
server.port=${PORT:8081}
server.error.include-message=always
nugget.timezone=Africa/Harare

# Default = run on your own computer with a temporary in-memory database (wiped on every restart).
spring.datasource.url=jdbc:h2:mem:nugget
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=false

# Accounts created the first time the app starts (can be changed with environment variables online)
nugget.demo-users=true
nugget.demo-password=password
nugget.manager-password=password
